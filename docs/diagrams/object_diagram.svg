    <text x="24" y="36" font-size="16" font-weight="bold" fill="#0f172a">UML 2.5 Object Diagram Technical Specification &amp; Source Verification:</text>
    <text x="24" y="70" font-size="14" fill="#334155">1. <tspan font-weight="bold">Standard Notation:</tspan> Conforms strictly to UML Object Diagram semantics. Instances are labeled with underlined <tspan font-weight="bold">instanceName : ClassName</tspan>.</text>
    <text x="24" y="98" font-size="14" fill="#334155">2. <tspan font-weight="bold">Slot Values:</tspan> Displays concrete runtime attribute values captured during an active ServiceRequest evaluation in Semester III.</text>
    <text x="24" y="126" font-size="14" fill="#334155">3. <tspan font-weight="bold">Instance Links:</tspan> Represents physical memory pointers and foreign-key links between instantiated Django domain objects.</text>
    <text x="24" y="154" font-size="14" fill="#334155">4. <tspan font-weight="bold">Model Conformance:</tspan> Directly matches source code models: <tspan font-style="italic">accounts.User, requests.ServiceRequest, workflows.WorkflowStage, audit.AuditRecord, assignments.Assignment</tspan>.</text>
    <text x="24" y="182" font-size="14" fill="#334155">5. <tspan font-weight="bold">Distinction from Class Diagram:</tspan> No operations/methods or abstract types are shown; only concrete instantiated runtime data.</text>
