<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="70" fill="#0f172a"/>
  <text x="800" y="42" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">Figure 3.4: UML Sequence Diagram — Student Request Creation &amp; Stage Initialization</text>
  <text x="800" y="62" fill="#94a3b8" font-size="13" text-anchor="middle">Chronological Object Lifeline Interaction across React Frontend, REST API, WorkflowEngine, and ORM</text>

  <!-- Lifeline Headers (Boxes) -->
  <!-- 1. Student (Actor) -->
  <g transform="translate(60, 100)" filter="url(#shadow)">
    <rect width="180" height="50" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="90" y="30" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">student : Student</text>
  </g>
  <!-- 2. UI: React SPA -->
  <g transform="translate(320, 100)" filter="url(#shadow)">
    <rect width="200" height="50" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="100" y="30" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">ui : React Frontend</text>
  </g>
  <!-- 3. API: DRF Controller -->
  <g transform="translate(600, 100)" filter="url(#shadow)">
    <rect width="220" height="50" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="110" y="30" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">api : StudentRequestViewSet</text>
  </g>
  <!-- 4. WFE: WorkflowEngine -->
  <g transform="translate(900, 100)" filter="url(#shadow)">
    <rect width="200" height="50" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="100" y="30" font-size="14" font-weight="bold" fill="#7f1d1d" text-anchor="middle">wfe : WorkflowEngine</text>
  </g>
  <!-- 5. SLA: SLAEngine -->
  <g transform="translate(1180, 100)" filter="url(#shadow)">
    <rect width="180" height="50" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="90" y="30" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">sla : SLAEngine</text>
  </g>
  <!-- 6. DB: Django ORM -->
  <g transform="translate(1420, 100)" filter="url(#shadow)">
    <rect width="140" height="50" rx="4" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
    <text x="70" y="30" font-size="14" font-weight="bold" fill="#581c87" text-anchor="middle">db : SQLite / ORM</text>
  </g>

  <!-- Lifeline Dashed Lines -->
  <line x1="150" y1="150" x2="150" y2="1020" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="420" y1="150" x2="420" y2="1020" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="710" y1="150" x2="710" y2="1020" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="1000" y1="150" x2="1000" y2="1020" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="1270" y1="150" x2="1270" y2="1020" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="1490" y1="150" x2="1490" y2="1020" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Activation Bars -->
  <rect x="144" y="190" width="12" height="760" fill="#cbd5e1" stroke="#475569"/>
  <rect x="414" y="210" width="12" height="720" fill="#bfdbfe" stroke="#1d4ed8"/>
  <rect x="704" y="240" width="12" height="660" fill="#bbf7d0" stroke="#15803d"/>
  <rect x="994" y="340" width="12" height="340" fill="#fecaca" stroke="#b91c1c"/>
  <rect x="1264" y="720" width="12" height="110" fill="#fde68a" stroke="#d97706"/>
  <rect x="1484" y="440" width="12" height="220" fill="#e9d5ff" stroke="#7e22ce"/>

  <!-- Messages -->
  <!-- 1. Submit form -->
  <line x1="156" y1="210" x2="414" y2="210" stroke="#0f172a" stroke-width="2"/>
  <polygon points="406,206 414,210 406,214" fill="#0f172a"/>
  <text x="280" y="200" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">1: submitNewRequest(formData)</text>

  <!-- 2. HTTP POST -->
  <line x1="426" y1="240" x2="704" y2="240" stroke="#0f172a" stroke-width="2"/>
  <polygon points="696,236 704,240 696,244" fill="#0f172a"/>
  <text x="560" y="230" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">2: POST /api/v1/requests/ (Bearer JWT)</text>

  <!-- 3. Self Call: Validate Serializer -->
  <path d="M 716, 270 L 760, 270 L 760, 300 L 716, 300" fill="none" stroke="#0f172a" stroke-width="1.8"/>
  <polygon points="724,296 716,300 724,304" fill="#0f172a"/>
  <text x="770" y="290" font-size="11" fill="#334155">3: serializer.is_valid()</text>

  <!-- 4. Call WFE get_initial_stage -->
  <line x1="716" y1="340" x2="994" y2="340" stroke="#0f172a" stroke-width="2"/>
  <polygon points="986,336 994,340 986,344" fill="#0f172a"/>
  <text x="850" y="330" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">4: get_initial_stage(workflow)</text>

  <!-- 5. Return initial stage -->
  <line x1="994" y1="390" x2="716" y2="390" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="724,386 716,390 724,394" fill="#475569"/>
  <text x="850" y="380" font-size="11" fill="#475569" text-anchor="middle">5: return initial_stage ("Submitted")</text>

  <!-- 6. Atomic Transaction: Create Request Record -->
  <line x1="1006" y1="440" x2="1484" y2="440" stroke="#0f172a" stroke-width="2"/>
  <polygon points="1476,436 1484,440 1476,444" fill="#0f172a"/>
  <text x="1240" y="430" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">6: INSERT ServiceRequest (ref, student, stage..)</text>

  <!-- 7. Create RequestStageHistory -->
  <line x1="1006" y1="510" x2="1484" y2="510" stroke="#0f172a" stroke-width="2"/>
  <polygon points="1476,506 1484,510 1476,514" fill="#0f172a"/>
  <text x="1240" y="500" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">7: INSERT RequestStageHistory (stage, entered_at)</text>

  <!-- 8. Create AuditRecord -->
  <line x1="1006" y1="580" x2="1484" y2="580" stroke="#0f172a" stroke-width="2"/>
  <polygon points="1476,576 1484,580 1476,584" fill="#0f172a"/>
  <text x="1240" y="570" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">8: INSERT AuditRecord ("REQUEST_CREATED")</text>

  <!-- 9. Return Created Request -->
  <line x1="1484" y1="640" x2="1006" y2="640" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="1014,636 1006,640 1014,644" fill="#475569"/>
  <text x="1240" y="630" font-size="11" fill="#475569" text-anchor="middle">9: return request_instance</text>

  <!-- 10. Call SLA Engine -->
  <line x1="716" y1="720" x2="1264" y2="720" stroke="#0f172a" stroke-width="2"/>
  <polygon points="1256,716 1264,720 1256,724" fill="#0f172a"/>
  <text x="990" y="710" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">10: compute_stage_sla(service_request)</text>

  <!-- 11. Return SLA metrics -->
  <line x1="1264" y1="790" x2="716" y2="790" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="724,786 716,790 724,794" fill="#475569"/>
  <text x="990" y="780" font-size="11" fill="#475569" text-anchor="middle">11: return SLAResult (target_hours, risk_level="safe")</text>

  <!-- 12. HTTP 201 Response -->
  <line x1="704" y1="860" x2="426" y2="860" stroke="#15803d" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="434,856 426,860 434,864" fill="#15803d"/>
  <text x="560" y="850" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">12: HTTP 201 Created (reference_number, digest, sla)</text>

  <!-- 13. UI Success Screen -->
  <line x1="414" y1="910" x2="156" y2="910" stroke="#15803d" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="164,906 156,910 164,914" fill="#15803d"/>
  <text x="280" y="900" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">13: renderSuccessScreen(referenceNumber, digest)</text>

  <!-- Legend & Specification -->
  <g transform="translate(60, 1040)">
    <rect width="1480" height="140" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="24" y="28" font-size="15" font-weight="bold" fill="#0f172a">UML 2.5 Sequence Diagram Verification &amp; Architectural Alignment:</text>
    <text x="24" y="54" font-size="13" fill="#334155">• <tspan font-weight="bold">Temporal Flow:</tspan> Accurately depicts chronological execution order during the primary end-to-end request creation scenario.</text>
    <text x="24" y="78" font-size="13" fill="#334155">• <tspan font-weight="bold">Decoupled Service Logic:</tspan> Validates that <tspan font-style="italic">WorkflowEngine</tspan> executes purely in Python within an atomic transaction (<tspan font-weight="bold">django.db.transaction.atomic</tspan>).</text>
    <text x="24" y="102" font-size="13" fill="#334155">• <tspan font-weight="bold">Dual Ledger Integrity:</tspan> Concurrently creates <tspan font-weight="bold">RequestStageHistory</tspan> (for velocity analytics) and immutable <tspan font-weight="bold">AuditRecord</tspan> (for governance).</text>
    <text x="24" y="126" font-size="13" fill="#334155">• <tspan font-weight="bold">Deterministic SLA Probe:</tspan> Calls <tspan font-style="italic">SLAEngine.compute_stage_sla()</tspan> synchronously to embed real-time compliance metrics in the JSON envelope.</text>
  </g>
</svg>