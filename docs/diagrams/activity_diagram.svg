<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="70" fill="#0f172a"/>
  <text x="800" y="42" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">Figure 3.5: UML Activity Diagram — Service Request Lifecycle Business Process</text>
  <text x="800" y="62" fill="#94a3b8" font-size="13" text-anchor="middle">Control Flow, Guard Conditions, Decision Nodes, and Stage Evolution across Institutional Workflows</text>

  <!-- Swimlane: Student (Left) -->
  <rect x="80" y="90" width="460" height="1100" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="80" y="90" width="460" height="40" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="310" y="116" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Student Participant</text>

  <!-- Swimlane: InsightFlow Engine (Center) -->
  <rect x="540" y="90" width="520" height="1100" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="540" y="90" width="520" height="40" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="800" y="116" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">InsightFlow Core Engine (Backend &amp; SLA)</text>

  <!-- Swimlane: Staff Officer (Right) -->
  <rect x="1060" y="90" width="460" height="1100" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="1060" y="90" width="460" height="40" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1290" y="116" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Department Staff Officer</text>

  <!-- Initial Node (Solid Black Circle) -->
  <circle cx="310" cy="170" r="14" fill="#0f172a"/>

  <!-- Action 1: Authenticate & Select Category -->
  <g transform="translate(180, 220)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
    <text x="130" y="30" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">Select Service Area &amp; Category</text>
  </g>
  <line x1="310" y1="184" x2="310" y2="220" stroke="#0f172a" stroke-width="2"/>
  <polygon points="306,212 310,220 314,212" fill="#0f172a"/>

  <!-- Action 2: Fill Dynamic Form & Submit -->
  <g transform="translate(180, 310)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
    <text x="130" y="30" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">Fill Dynamic Fields &amp; Attach Files</text>
  </g>
  <line x1="310" y1="270" x2="310" y2="310" stroke="#0f172a" stroke-width="2"/>
  <polygon points="306,302 310,310 314,302" fill="#0f172a"/>

  <!-- Decision 1: Validation -->
  <path d="M 310, 400 L 350, 425 L 310, 450 L 270, 425 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <line x1="310" y1="360" x2="310" y2="400" stroke="#0f172a" stroke-width="2"/>
  <polygon points="306,392 310,400 314,392" fill="#0f172a"/>

  <!-- Guard: [Invalid Data] Loopback -->
  <path d="M 270, 425 L 140, 425 L 140, 335 L 180, 335" fill="none" stroke="#b91c1c" stroke-width="1.8"/>
  <polygon points="172,331 180,335 172,339" fill="#b91c1c"/>
  <text x="120" y="390" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">[Validation Error]</text>

  <!-- Guard: [Valid] -> Backend Action: Initialise Request -->
  <line x1="350" y1="425" x2="680" y2="425" stroke="#15803d" stroke-width="2"/>
  <polygon points="672,421 680,425 672,429" fill="#15803d"/>
  <text x="490" y="415" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">[Valid Data: POST /requests/]</text>

  <!-- Action 3: Initialise Workflow & SLA Clock -->
  <g transform="translate(680, 400)" filter="url(#shadow)">
    <rect width="240" height="50" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/>
    <text x="120" y="24" font-size="12" font-weight="600" fill="#14532d" text-anchor="middle">Assign Initial Stage &amp;</text>
    <text x="120" y="40" font-size="12" font-weight="600" fill="#14532d" text-anchor="middle">Start Deterministic SLA Clock</text>
  </g>

  <!-- Flow to Staff Queue -->
  <line x1="800" y1="450" x2="800" y2="520" stroke="#0f172a" stroke-width="2"/>
  <line x1="800" y1="520" x2="1170" y2="520" stroke="#0f172a" stroke-width="2"/>
  <polygon points="1162,516 1170,520 1162,524" fill="#0f172a"/>

  <!-- Action 4: Staff Review in Department Queue -->
  <g transform="translate(1170, 495)" filter="url(#shadow)">
    <rect width="240" height="50" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
    <text x="120" y="24" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">Inspect Request Details &amp;</text>
    <text x="120" y="40" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">Department SLA Thresholds</text>
  </g>

  <!-- Action 5: Transition to Under Review / In Progress -->
  <g transform="translate(1170, 580)" filter="url(#shadow)">
    <rect width="240" height="50" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
    <text x="120" y="30" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">Execute Transition: "Under Review"</text>
  </g>
  <line x1="1290" y1="545" x2="1290" y2="580" stroke="#0f172a" stroke-width="2"/>
  <polygon points="1286,572 1290,580 1294,572" fill="#0f172a"/>

  <!-- Flow to Backend: Update Stage History & Audit -->
  <line x1="1170" y1="605" x2="920" y2="605" stroke="#0f172a" stroke-width="2"/>
  <polygon points="928,601 920,605 928,609" fill="#0f172a"/>

  <!-- Action 6: Record Stage Velocity & Audit Log -->
  <g transform="translate(680, 580)" filter="url(#shadow)">
    <rect width="240" height="50" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/>
    <text x="120" y="24" font-size="12" font-weight="600" fill="#14532d" text-anchor="middle">Close Dwell Velocity &amp;</text>
    <text x="120" y="40" font-size="12" font-weight="600" fill="#14532d" text-anchor="middle">Append Immutable Audit Record</text>
  </g>

  <!-- Staff Evaluation Decision -->
  <path d="M 1290, 680 L 1330, 710 L 1290, 740 L 1250, 710 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <line x1="1290" y1="630" x2="1290" y2="680" stroke="#0f172a" stroke-width="2"/>
  <polygon points="1286,672 1290,680 1294,672" fill="#0f172a"/>

  <!-- Decision Branch 1: Approved / Resolved -->
  <line x1="1250" y1="710" x2="1140" y2="710" stroke="#15803d" stroke-width="2"/>
  <line x1="1140" y1="710" x2="1140" y2="780" stroke="#15803d" stroke-width="2"/>
  <polygon points="1136,772 1140,780 1144,772" fill="#15803d"/>
  <text x="1185" y="700" font-size="11" font-weight="bold" fill="#15803d">[Meets Criteria]</text>

  <g transform="translate(1040, 780)" filter="url(#shadow)">
    <rect width="200" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="100" y="30" font-size="12" font-weight="600" fill="#14532d" text-anchor="middle">Transition to "Approved"</text>
  </g>

  <!-- Decision Branch 2: Rejected -->
  <line x1="1330" y1="710" x2="1440" y2="710" stroke="#b91c1c" stroke-width="2"/>
  <line x1="1440" y1="710" x2="1440" y2="780" stroke="#b91c1c" stroke-width="2"/>
  <polygon points="1436,772 1440,780 1444,772" fill="#b91c1c"/>
  <text x="1390" y="700" font-size="11" font-weight="bold" fill="#b91c1c">[Fails Criteria]</text>

  <g transform="translate(1340, 780)" filter="url(#shadow)">
    <rect width="200" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="100" y="30" font-size="12" font-weight="600" fill="#7f1d1d" text-anchor="middle">Transition to "Rejected"</text>
  </g>

  <!-- Flow into Terminal Engine Handling -->
  <path d="M 1140, 830 L 1140, 880 L 800, 880" fill="none" stroke="#0f172a" stroke-width="2"/>
  <path d="M 1440, 830 L 1440, 880 L 800, 880" fill="none" stroke="#0f172a" stroke-width="2"/>
  <line x1="800" y1="880" x2="800" y2="920" stroke="#0f172a" stroke-width="2"/>
  <polygon points="796,912 800,920 804,912" fill="#0f172a"/>

  <!-- Action 7: Terminal State & In-App Notification -->
  <g transform="translate(680, 920)" filter="url(#shadow)">
    <rect width="240" height="50" rx="8" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.8"/>
    <text x="120" y="24" font-size="12" font-weight="600" fill="#581c87" text-anchor="middle">Generate SHA-256 Digest &amp;</text>
    <text x="120" y="40" font-size="12" font-weight="600" fill="#581c87" text-anchor="middle">Dispatch In-App Notification</text>
  </g>

  <!-- Flow back to Student -->
  <line x1="680" y1="945" x2="440" y2="945" stroke="#0f172a" stroke-width="2"/>
  <polygon points="448,941 440,945 448,949" fill="#0f172a"/>

  <!-- Action 8: Student Submits CSAT Rating -->
  <g transform="translate(180, 920)" filter="url(#shadow)">
    <rect width="260" height="50" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
    <text x="130" y="30" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">Submit Multi-Metric CSAT Rating</text>
  </g>

  <!-- Final Node (Bullseye Circle) -->
  <line x1="310" y1="970" x2="310" y2="1030" stroke="#0f172a" stroke-width="2"/>
  <polygon points="306,1022 310,1030 314,1022" fill="#0f172a"/>
  <circle cx="310" cy="1050" r="16" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="310" cy="1050" r="10" fill="#0f172a"/>

  <!-- Verification Note -->
  <g transform="translate(80, 1205)">
    <rect width="1440" height="135" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="24" y="28" font-size="15" font-weight="bold" fill="#0f172a">UML 2.5 Activity Diagram Verification &amp; Process Semantics:</text>
    <text x="24" y="54" font-size="13" fill="#334155">• <tspan font-weight="bold">Swimlane Governance:</tspan> Clearly partitions activity execution across <tspan font-weight="bold">Student, InsightFlow Engine</tspan>, and <tspan font-weight="bold">Staff Officer</tspan>.</text>
    <text x="24" y="78" font-size="13" fill="#334155">• <tspan font-weight="bold">Decision Nodes &amp; Guards:</tspan> Formal diamond decision gates enforce validation loops and first-class rejection transition paths (<tspan font-style="italic">is_rejection=True</tspan>).</text>
    <text x="24" y="102" font-size="13" fill="#334155">• <tspan font-weight="bold">Standard Nodes:</tspan> Begins with a solid initial circle and completes at a standard bullseye final activity node.</text>
    <text x="24" y="124" font-size="13" fill="#334155">• <tspan font-weight="bold">SLA Concurrency:</tspan> Documents automated transition dwell closing and SHA-256 cryptographic verification digest emission upon terminal resolution.</text>
  </g>
</svg>