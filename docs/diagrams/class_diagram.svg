<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1300" width="1700" height="1300" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1700" height="70" fill="#0f172a"/>
  <text x="850" y="42" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">Figure 3.2: UML Class Diagram — InsightFlow Domain Class Architecture</text>
  <text x="850" y="62" fill="#94a3b8" font-size="13" text-anchor="middle">Structural Object-Oriented Software Design with Attributes, Operations, and Associations</text>

  <!-- Class: User -->
  <g transform="translate(60, 100)" filter="url(#shadow)">
    <rect width="280" height="230" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
    <rect width="280" height="34" rx="4" fill="#e2e8f0" stroke="#1e293b" stroke-width="2"/>
    <text x="140" y="23" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">User (AbstractBaseUser)</text>
    <line x1="0" y1="34" x2="280" y2="34" stroke="#1e293b" stroke-width="1.5"/>
    <text x="12" y="54" font-size="12" fill="#334155">+ id: UUID</text>
    <text x="12" y="72" font-size="12" fill="#334155">+ email: EmailField</text>
    <text x="12" y="90" font-size="12" fill="#334155">+ full_name: CharField</text>
    <text x="12" y="108" font-size="12" fill="#334155">+ role: CharField (Enum)</text>
    <text x="12" y="126" font-size="12" fill="#334155">+ is_staff: Boolean</text>
    <text x="12" y="144" font-size="12" fill="#334155">+ is_active: Boolean</text>
    <line x1="0" y1="156" x2="280" y2="156" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="176" font-size="12" fill="#0f172a">+ set_password(raw_pwd): void</text>
    <text x="12" y="194" font-size="12" fill="#0f172a">+ check_password(raw_pwd): bool</text>
    <text x="12" y="212" font-size="12" fill="#0f172a">+ get_full_name(): str</text>
  </g>

  <!-- Class: StudentProfile -->
  <g transform="translate(60, 390)" filter="url(#shadow)">
    <rect width="280" height="170" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
    <rect width="280" height="34" rx="4" fill="#e2e8f0" stroke="#1e293b" stroke-width="2"/>
    <text x="140" y="23" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">StudentProfile</text>
    <line x1="0" y1="34" x2="280" y2="34" stroke="#1e293b" stroke-width="1.5"/>
    <text x="12" y="54" font-size="12" fill="#334155">+ id: UUID</text>
    <text x="12" y="72" font-size="12" fill="#334155">+ roll_number: CharField</text>
    <text x="12" y="90" font-size="12" fill="#334155">+ programme: CharField</text>
    <text x="12" y="108" font-size="12" fill="#334155">+ semester: CharField</text>
    <text x="12" y="126" font-size="12" fill="#334155">+ division: CharField</text>
    <line x1="0" y1="138" x2="280" y2="138" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="156" font-size="12" fill="#0f172a">+ __str__(): str</text>
  </g>

  <!-- Class: StaffProfile -->
  <g transform="translate(60, 620)" filter="url(#shadow)">
    <rect width="280" height="170" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
    <rect width="280" height="34" rx="4" fill="#e2e8f0" stroke="#1e293b" stroke-width="2"/>
    <text x="140" y="23" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">StaffProfile</text>
    <line x1="0" y1="34" x2="280" y2="34" stroke="#1e293b" stroke-width="1.5"/>
    <text x="12" y="54" font-size="12" fill="#334155">+ id: UUID</text>
    <text x="12" y="72" font-size="12" fill="#334155">+ employee_id: CharField</text>
    <text x="12" y="90" font-size="12" fill="#334155">+ designation: CharField</text>
    <line x1="0" y1="110" x2="280" y2="110" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="132" font-size="12" fill="#0f172a">+ is_assigned_to(request): bool</text>
    <text x="12" y="152" font-size="12" fill="#0f172a">+ get_active_workload(): int</text>
  </g>

  <!-- Class: Department -->
  <g transform="translate(440, 620)" filter="url(#shadow)">
    <rect width="280" height="190" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
    <rect width="280" height="34" rx="4" fill="#e2e8f0" stroke="#1e293b" stroke-width="2"/>
    <text x="140" y="23" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Department</text>
    <line x1="0" y1="34" x2="280" y2="34" stroke="#1e293b" stroke-width="1.5"/>
    <text x="12" y="54" font-size="12" fill="#334155">+ id: UUID</text>
    <text x="12" y="72" font-size="12" fill="#334155">+ name: CharField</text>
    <text x="12" y="90" font-size="12" fill="#334155">+ code: CharField (Unique)</text>
    <text x="12" y="108" font-size="12" fill="#334155">+ is_active: Boolean</text>
    <line x1="0" y1="126" x2="280" y2="126" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="148" font-size="12" fill="#0f172a">+ get_active_queue(): QuerySet</text>
    <text x="12" y="168" font-size="12" fill="#0f172a">+ get_sla_compliance_rate(): float</text>
  </g>

  <!-- Class: ServiceRequest -->
  <g transform="translate(440, 100)" filter="url(#shadow)">
    <rect width="360" height="310" rx="4" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
    <rect width="360" height="34" rx="4" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
    <text x="180" y="23" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">ServiceRequest</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#166534" stroke-width="1.5"/>
    <text x="12" y="54" font-size="12" fill="#14532d">+ id: UUID</text>
    <text x="12" y="72" font-size="12" fill="#14532d">+ reference_number: CharField (Unique)</text>
    <text x="12" y="90" font-size="12" fill="#14532d">+ title: CharField</text>
    <text x="12" y="108" font-size="12" fill="#14532d">+ details: TextField</text>
    <text x="12" y="126" font-size="12" fill="#14532d">+ priority: CharField (Enum)</text>
    <text x="12" y="144" font-size="12" fill="#14532d">+ status: CharField (Enum)</text>
    <text x="12" y="162" font-size="12" fill="#14532d">+ dynamic_fields_data: JSONField</text>
    <text x="12" y="180" font-size="12" fill="#14532d">+ stage_entered_at: DateTime</text>
    <text x="12" y="198" font-size="12" fill="#14532d">+ resolved_at: DateTime</text>
    <line x1="0" y1="210" x2="360" y2="210" stroke="#86efac" stroke-width="1"/>
    <text x="12" y="232" font-size="12" fill="#14532d">+ is_terminal(): bool (property)</text>
    <text x="12" y="250" font-size="12" fill="#14532d">+ elapsed_seconds_in_stage(): float</text>
    <text x="12" y="268" font-size="12" fill="#14532d">+ get_allowed_next_stages(): list</text>
    <text x="12" y="286" font-size="12" fill="#14532d">+ generate_verification_digest(): str</text>
  </g>

  <!-- Class: ServiceCategory -->
  <g transform="translate(900, 100)" filter="url(#shadow)">
    <rect width="320" height="210" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
    <rect width="320" height="34" rx="4" fill="#e2e8f0" stroke="#1e293b" stroke-width="2"/>
    <text x="160" y="23" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">ServiceCategory</text>
    <line x1="0" y1="34" x2="320" y2="34" stroke="#1e293b" stroke-width="1.5"/>
    <text x="12" y="54" font-size="12" fill="#334155">+ id: UUID</text>
    <text x="12" y="72" font-size="12" fill="#334155">+ name: CharField</text>
    <text x="12" y="90" font-size="12" fill="#334155">+ description: TextField</text>
    <text x="12" y="108" font-size="12" fill="#334155">+ default_priority: CharField</text>
    <text x="12" y="126" font-size="12" fill="#334155">+ requires_attachment: Boolean</text>
    <text x="12" y="144" font-size="12" fill="#334155">+ is_active: Boolean</text>
    <line x1="0" y1="156" x2="320" y2="156" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="178" font-size="12" fill="#0f172a">+ get_dynamic_schema(): list</text>
    <text x="12" y="196" font-size="12" fill="#0f172a">+ get_owning_department(): Department</text>
  </g>

  <!-- Class: DynamicFieldSchema -->
  <g transform="translate(900, 370)" filter="url(#shadow)">
    <rect width="320" height="190" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
    <rect width="320" height="34" rx="4" fill="#e2e8f0" stroke="#1e293b" stroke-width="2"/>
    <text x="160" y="23" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">DynamicFieldSchema</text>
    <line x1="0" y1="34" x2="320" y2="34" stroke="#1e293b" stroke-width="1.5"/>
    <text x="12" y="54" font-size="12" fill="#334155">+ id: UUID</text>
    <text x="12" y="72" font-size="12" fill="#334155">+ field_key: CharField</text>
    <text x="12" y="90" font-size="12" fill="#334155">+ field_label: CharField</text>
    <text x="12" y="108" font-size="12" fill="#334155">+ field_type: CharField (text, select..)</text>
    <text x="12" y="126" font-size="12" fill="#334155">+ is_required: Boolean</text>
    <line x1="0" y1="140" x2="320" y2="140" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="162" font-size="12" fill="#0f172a">+ validate_value(value): bool</text>
    <text x="12" y="180" font-size="12" fill="#0f172a">+ get_options_list(): list</text>
  </g>

  <!-- Class: WorkflowDefinition -->
  <g transform="translate(1300, 100)" filter="url(#shadow)">
    <rect width="340" height="190" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
    <rect width="340" height="34" rx="4" fill="#e2e8f0" stroke="#1e293b" stroke-width="2"/>
    <text x="170" y="23" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">WorkflowDefinition</text>
    <line x1="0" y1="34" x2="340" y2="34" stroke="#1e293b" stroke-width="1.5"/>
    <text x="12" y="54" font-size="12" fill="#334155">+ id: UUID</text>
    <text x="12" y="72" font-size="12" fill="#334155">+ name: CharField</text>
    <text x="12" y="90" font-size="12" fill="#334155">+ version: IntegerField</text>
    <text x="12" y="108" font-size="12" fill="#334155">+ is_active: Boolean</text>
    <line x1="0" y1="124" x2="340" y2="124" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="146" font-size="12" fill="#0f172a">+ get_initial_stage(): WorkflowStage</text>
    <text x="12" y="166" font-size="12" fill="#0f172a">+ get_terminal_stages(): list</text>
  </g>

  <!-- Class: WorkflowStage -->
  <g transform="translate(1300, 350)" filter="url(#shadow)">
    <rect width="340" height="230" rx="4" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
    <rect width="340" height="34" rx="4" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/>
    <text x="170" y="23" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">WorkflowStage</text>
    <line x1="0" y1="34" x2="340" y2="34" stroke="#1e40af" stroke-width="1.5"/>
    <text x="12" y="54" font-size="12" fill="#1e3a8a">+ id: UUID</text>
    <text x="12" y="72" font-size="12" fill="#1e3a8a">+ name: CharField</text>
    <text x="12" y="90" font-size="12" fill="#1e3a8a">+ code: CharField</text>
    <text x="12" y="108" font-size="12" fill="#1e3a8a">+ order: IntegerField</text>
    <text x="12" y="126" font-size="12" fill="#1e3a8a">+ is_initial: Boolean</text>
    <text x="12" y="144" font-size="12" fill="#1e3a8a">+ is_terminal: Boolean</text>
    <text x="12" y="162" font-size="12" fill="#1e3a8a">+ is_rejection: Boolean</text>
    <line x1="0" y1="174" x2="340" y2="174" stroke="#93c5fd" stroke-width="1"/>
    <text x="12" y="196" font-size="12" fill="#1e3a8a">+ get_allowed_transitions(): list</text>
    <text x="12" y="214" font-size="12" fill="#1e3a8a">+ is_sla_breached(elapsed_mins): bool</text>
  </g>

  <!-- Class: SLAConfiguration -->
  <g transform="translate(1300, 640)" filter="url(#shadow)">
    <rect width="340" height="170" rx="4" fill="#fef2f2" stroke="#991b1b" stroke-width="2"/>
    <rect width="340" height="34" rx="4" fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
    <text x="170" y="23" font-size="14" font-weight="bold" text-anchor="middle" fill="#7f1d1d">SLAConfiguration</text>
    <line x1="0" y1="34" x2="340" y2="34" stroke="#991b1b" stroke-width="1.5"/>
    <text x="12" y="54" font-size="12" fill="#7f1d1d">+ id: UUID</text>
    <text x="12" y="72" font-size="12" fill="#7f1d1d">+ target_hours: DecimalField</text>
    <text x="12" y="90" font-size="12" fill="#7f1d1d">+ warning_threshold_pct: Integer</text>
    <text x="12" y="108" font-size="12" fill="#7f1d1d">+ critical_threshold_pct: Integer</text>
    <line x1="0" y1="120" x2="340" y2="120" stroke="#fca5a5" stroke-width="1"/>
    <text x="12" y="142" font-size="12" fill="#7f1d1d">+ get_warning_minutes(): float</text>
    <text x="12" y="160" font-size="12" fill="#7f1d1d">+ get_critical_minutes(): float</text>
  </g>

  <!-- Lower Row: History, Audit, Assignment -->
  <!-- Class: RequestStageHistory -->
  <g transform="translate(440, 480)" filter="url(#shadow)">
    <rect width="360" height="190" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <rect width="360" height="34" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <text x="180" y="23" font-size="14" font-weight="bold" text-anchor="middle" fill="#78350f">RequestStageHistory</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#b45309" stroke-width="1.5"/>
    <text x="12" y="54" font-size="12" fill="#78350f">+ id: UUID</text>
    <text x="12" y="72" font-size="12" fill="#78350f">+ entered_at: DateTime</text>
    <text x="12" y="90" font-size="12" fill="#78350f">+ exited_at: DateTime</text>
    <text x="12" y="108" font-size="12" fill="#78350f">+ duration_minutes: Integer</text>
    <text x="12" y="126" font-size="12" fill="#78350f">+ transition_note: TextField</text>
    <text x="12" y="144" font-size="12" fill="#78350f">+ sla_breached: Boolean</text>
    <line x1="0" y1="156" x2="360" y2="156" stroke="#fcd34d" stroke-width="1"/>
    <text x="12" y="178" font-size="12" fill="#78350f">+ close_stage(actor, note): void</text>
  </g>

  <!-- Class: AuditRecord -->
  <g transform="translate(860, 620)" filter="url(#shadow)">
    <rect width="360" height="190" rx="4" fill="#faf5ff" stroke="#6b21a8" stroke-width="2"/>
    <rect width="360" height="34" rx="4" fill="#e9d5ff" stroke="#6b21a8" stroke-width="2"/>
    <text x="180" y="23" font-size="14" font-weight="bold" text-anchor="middle" fill="#581c87">AuditRecord (Immutable)</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#6b21a8" stroke-width="1.5"/>
    <text x="12" y="54" font-size="12" fill="#581c87">+ id: UUID</text>
    <text x="12" y="72" font-size="12" fill="#581c87">+ action: CharField (Enum)</text>
    <text x="12" y="90" font-size="12" fill="#581c87">+ description: TextField</text>
    <text x="12" y="108" font-size="12" fill="#581c87">+ metadata_json: JSONField</text>
    <text x="12" y="126" font-size="12" fill="#581c87">+ timestamp: DateTime</text>
    <text x="12" y="144" font-size="12" fill="#581c87">+ is_student_visible: Boolean</text>
    <line x1="0" y1="156" x2="360" y2="156" stroke="#d8b4fe" stroke-width="1"/>
    <text x="12" y="178" font-size="12" fill="#581c87">+ log_transition(actor, req, ...): AuditRecord</text>
  </g>

  <!-- Associations & Multiplicities -->
  <!-- User 1 - 0..1 StudentProfile -->
  <line x1="200" y1="330" x2="200" y2="390" stroke="#1e293b" stroke-width="1.5"/>
  <text x="210" y="350" font-size="11" fill="#475569">1</text>
  <text x="210" y="380" font-size="11" fill="#475569">0..1</text>

  <!-- User 1 - 0..1 StaffProfile -->
  <line x1="200" y1="560" x2="200" y2="620" stroke="#1e293b" stroke-width="1.5"/>
  <text x="210" y="580" font-size="11" fill="#475569">1</text>
  <text x="210" y="610" font-size="11" fill="#475569">0..1</text>

  <!-- User 1 - * ServiceRequest -->
  <line x1="340" y1="160" x2="440" y2="160" stroke="#1e293b" stroke-width="1.5"/>
  <text x="350" y="150" font-size="11" fill="#475569">1 (student)</text>
  <text x="410" y="150" font-size="11" fill="#475569">0..*</text>

  <!-- ServiceCategory 1 - * ServiceRequest -->
  <line x1="800" y1="160" x2="900" y2="160" stroke="#1e293b" stroke-width="1.5"/>
  <text x="810" y="150" font-size="11" fill="#475569">0..*</text>
  <text x="880" y="150" font-size="11" fill="#475569">1</text>

  <!-- ServiceCategory 1 - * DynamicFieldSchema -->
  <line x1="1060" y1="310" x2="1060" y2="370" stroke="#1e293b" stroke-width="1.5"/>
  <text x="1070" y="330" font-size="11" fill="#475569">1</text>
  <text x="1070" y="360" font-size="11" fill="#475569">0..*</text>

  <!-- WorkflowDefinition 1 - * WorkflowStage -->
  <line x1="1470" y1="290" x2="1470" y2="350" stroke="#1e293b" stroke-width="1.5"/>
  <text x="1480" y="310" font-size="11" fill="#475569">1</text>
  <text x="1480" y="340" font-size="11" fill="#475569">1..*</text>

  <!-- WorkflowStage 1 - 0..1 SLAConfiguration -->
  <line x1="1470" y1="580" x2="1470" y2="640" stroke="#1e293b" stroke-width="1.5"/>
  <text x="1480" y="600" font-size="11" fill="#475569">1</text>
  <text x="1480" y="630" font-size="11" fill="#475569">0..1</text>

  <!-- ServiceRequest 1 - 1 WorkflowStage (current_stage) -->
  <line x1="800" y1="240" x2="1300" y2="400" stroke="#1e293b" stroke-width="1.5"/>
  <text x="815" y="235" font-size="11" fill="#475569">0..*</text>
  <text x="1230" y="390" font-size="11" fill="#475569">1 (current_stage)</text>

  <!-- ServiceRequest 1 - * RequestStageHistory -->
  <line x1="620" y1="410" x2="620" y2="480" stroke="#1e293b" stroke-width="1.5"/>
  <text x="630" y="430" font-size="11" fill="#475569">1</text>
  <text x="630" y="470" font-size="11" fill="#475569">0..*</text>

  <!-- ServiceRequest 1 - * AuditRecord -->
  <path d="M 700, 410 L 700, 700 L 860, 700" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <text x="710" y="430" font-size="11" fill="#475569">1</text>
  <text x="830" y="690" font-size="11" fill="#475569">0..*</text>

  <!-- StaffProfile * - 1 Department -->
  <line x1="340" y1="700" x2="440" y2="700" stroke="#1e293b" stroke-width="1.5"/>
  <text x="350" y="690" font-size="11" fill="#475569">0..*</text>
  <text x="410" y="690" font-size="11" fill="#475569">1</text>

  <!-- Verification Note -->
  <g transform="translate(60, 890)">
    <rect width="1580" height="380" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="24" y="36" font-size="16" font-weight="bold" fill="#0f172a">UML 2.5 Class Diagram Technical Specification &amp; Source Verification:</text>
    <text x="24" y="70" font-size="14" fill="#334155">1. <tspan font-weight="bold">Class Structure:</tspan> Conforms to standard 3-compartment UML specification: Top=Class Name, Middle=Typed Attributes, Bottom=Operations &amp; Methods.</text>
    <text x="24" y="98" font-size="14" fill="#334155">2. <tspan font-weight="bold">Multiplicity Semantics:</tspan> Accurately specifies 1..1, 0..1, 1..*, and 0..* multiplicities directly derived from Django model ForeignKey and OneToOneField declarations.</text>
    <text x="24" y="126" font-size="14" fill="#334155">3. <tspan font-weight="bold">Model Operations:</tspan> Reflects real implemented model and service methods: <tspan font-style="italic">elapsed_seconds_in_stage(), generate_verification_digest(), get_initial_stage(), close_stage()</tspan>.</text>
    <text x="24" y="154" font-size="14" fill="#334155">4. <tspan font-weight="bold">Immutability Principle:</tspan> <tspan font-weight="bold">AuditRecord</tspan> is explicitly modeled as an append-only ledger class without update/delete operations.</text>
  </g>
</svg>