<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="70" fill="#0f172a"/>
  <text x="800" y="42" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">Figure 3.3: UML Use Case Diagram — InsightFlow Role-Based Capabilities</text>
  <text x="800" y="62" fill="#94a3b8" font-size="13" text-anchor="middle">System Boundary, Authentic Primary Actors, Functional Use Cases, and &lt;&lt;include&gt;&gt; Relationships</text>

  <!-- System Boundary -->
  <rect x="340" y="90" width="920" height="1060" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2.5" stroke-dasharray="8 4"/>
  <text x="800" y="125" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">InsightFlow Institutional Accountability Platform Boundary</text>

  <!-- ACTOR 1: Student (Left) -->
  <g transform="translate(100, 240)">
    <circle cx="50" cy="30" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="50" y1="48" x2="50" y2="105" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="20" y1="65" x2="80" y2="65" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="50" y1="105" x2="25" y2="155" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="50" y1="105" x2="75" y2="155" stroke="#0f172a" stroke-width="2.5"/>
    <text x="50" y="185" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Student</text>
    <text x="50" y="205" font-size="12" fill="#64748b" text-anchor="middle">(Academic Applicant)</text>
  </g>

  <!-- ACTOR 2: Staff Member (Right, Upper) -->
  <g transform="translate(1420, 360)">
    <circle cx="50" cy="30" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="50" y1="48" x2="50" y2="105" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="20" y1="65" x2="80" y2="65" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="50" y1="105" x2="25" y2="155" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="50" y1="105" x2="75" y2="155" stroke="#0f172a" stroke-width="2.5"/>
    <text x="50" y="185" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Department Staff</text>
    <text x="50" y="205" font-size="12" fill="#64748b" text-anchor="middle">(Workflow Officer)</text>
  </g>

  <!-- ACTOR 3: Administrator (Right, Lower) -->
  <g transform="translate(1420, 820)">
    <circle cx="50" cy="30" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="50" y1="48" x2="50" y2="105" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="20" y1="65" x2="80" y2="65" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="50" y1="105" x2="25" y2="155" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="50" y1="105" x2="75" y2="155" stroke="#0f172a" stroke-width="2.5"/>
    <text x="50" y="185" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Administrator</text>
    <text x="50" y="205" font-size="12" fill="#64748b" text-anchor="middle">(Institutional Governance)</text>
  </g>

  <!-- Use Cases (Ovals) -->
  <!-- UC1: Authenticate via Institutional JWT -->
  <g transform="translate(680, 160)" filter="url(#shadow)">
    <ellipse cx="120" cy="32" rx="120" ry="32" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="120" y="37" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">Authenticate via Institutional JWT</text>
  </g>

  <!-- UC2: Submit Service Request -->
  <g transform="translate(400, 260)" filter="url(#shadow)">
    <ellipse cx="125" cy="32" rx="125" ry="32" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="125" y="37" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">Submit Service Request</text>
  </g>

  <!-- UC3: Fill Dynamic Category Form (<<include>>) -->
  <g transform="translate(740, 260)" filter="url(#shadow)">
    <ellipse cx="130" cy="32" rx="130" ry="32" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
    <text x="130" y="37" font-size="12" fill="#334155" text-anchor="middle">Fill Dynamic Category Schema</text>
  </g>

  <!-- UC4: Track Request Timeline & Digest -->
  <g transform="translate(400, 360)" filter="url(#shadow)">
    <ellipse cx="135" cy="32" rx="135" ry="32" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="135" y="37" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">Track Timeline &amp; Verify Digest</text>
  </g>

  <!-- UC5: Submit Post-Resolution CSAT Rating -->
  <g transform="translate(400, 460)" filter="url(#shadow)">
    <ellipse cx="130" cy="32" rx="130" ry="32" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="130" y="37" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">Submit Post-Resolution Feedback</text>
  </g>

  <!-- UC6: Submit Formal Appeal on Rejection -->
  <g transform="translate(400, 560)" filter="url(#shadow)">
    <ellipse cx="130" cy="32" rx="130" ry="32" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="130" y="37" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">Submit Appeal on Rejection</text>
  </g>

  <!-- UC7: View Department Work Queue & SLA Status -->
  <g transform="translate(940, 460)" filter="url(#shadow)">
    <ellipse cx="135" cy="32" rx="135" ry="32" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="135" y="37" font-size="13" font-weight="600" fill="#14532d" text-anchor="middle">View Department Queue &amp; SLA</text>
  </g>

  <!-- UC8: Execute Atomic Stage Transition -->
  <g transform="translate(940, 560)" filter="url(#shadow)">
    <ellipse cx="135" cy="32" rx="135" ry="32" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="135" y="37" font-size="13" font-weight="600" fill="#14532d" text-anchor="middle">Execute Atomic Stage Transition</text>
  </g>

  <!-- UC9: Reassign Request to Department Staff -->
  <g transform="translate(940, 660)" filter="url(#shadow)">
    <ellipse cx="130" cy="32" rx="130" ry="32" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="130" y="37" font-size="13" font-weight="600" fill="#14532d" text-anchor="middle">Assign Request to Officer</text>
  </g>

  <!-- UC10: Post Public / Internal Notes -->
  <g transform="translate(680, 660)" filter="url(#shadow)">
    <ellipse cx="120" cy="32" rx="120" ry="32" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="120" y="37" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Post Comments &amp; Notes</text>
  </g>

  <!-- UC11: Monitor Institutional Health Matrix -->
  <g transform="translate(940, 770)" filter="url(#shadow)">
    <ellipse cx="135" cy="32" rx="135" ry="32" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
    <text x="135" y="37" font-size="13" font-weight="600" fill="#581c87" text-anchor="middle">Monitor Department Health</text>
  </g>

  <!-- UC12: Analyze Bottlenecks & SLA Forecaster -->
  <g transform="translate(940, 870)" filter="url(#shadow)">
    <ellipse cx="135" cy="32" rx="135" ry="32" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
    <text x="135" y="37" font-size="13" font-weight="600" fill="#581c87" text-anchor="middle">Analyze Institutional Bottlenecks</text>
  </g>

  <!-- UC13: Inspect Global Audit Ledger -->
  <g transform="translate(940, 970)" filter="url(#shadow)">
    <ellipse cx="135" cy="32" rx="135" ry="32" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
    <text x="135" y="37" font-size="13" font-weight="600" fill="#581c87" text-anchor="middle">Audit Immutable Request Ledger</text>
  </g>

  <!-- UC14: Export Service Reports (CSV) -->
  <g transform="translate(940, 1070)" filter="url(#shadow)">
    <ellipse cx="130" cy="30" rx="130" ry="30" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
    <text x="130" y="35" font-size="12" font-weight="600" fill="#581c87" text-anchor="middle">Export Institutional CSV Reports</text>
  </g>

  <!-- Associations (Lines) -->
  <!-- Student associations -->
  <line x1="200" y1="280" x2="680" y2="190" stroke="#334155" stroke-width="1.8"/>
  <line x1="200" y1="290" x2="400" y2="290" stroke="#334155" stroke-width="1.8"/>
  <line x1="200" y1="310" x2="400" y2="390" stroke="#334155" stroke-width="1.8"/>
  <line x1="200" y1="330" x2="400" y2="490" stroke="#334155" stroke-width="1.8"/>
  <line x1="200" y1="350" x2="400" y2="590" stroke="#334155" stroke-width="1.8"/>
  <line x1="200" y1="370" x2="680" y2="690" stroke="#334155" stroke-width="1.8"/>

  <!-- <<include>> arrow UC2 -> UC3 -->
  <line x1="650" y1="290" x2="740" y2="290" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="735,286 743,290 735,294" fill="#0f172a"/>
  <text x="695" y="280" font-size="11" fill="#475569" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Staff associations -->
  <line x1="1420" y1="420" x2="920" y2="190" stroke="#334155" stroke-width="1.8"/>
  <line x1="1420" y1="440" x2="1210" y2="490" stroke="#334155" stroke-width="1.8"/>
  <line x1="1420" y1="460" x2="1210" y2="590" stroke="#334155" stroke-width="1.8"/>
  <line x1="1420" y1="480" x2="1200" y2="690" stroke="#334155" stroke-width="1.8"/>
  <line x1="1420" y1="500" x2="920" y2="690" stroke="#334155" stroke-width="1.8"/>

  <!-- Admin associations -->
  <line x1="1420" y1="880" x2="920" y2="190" stroke="#334155" stroke-width="1.8"/>
  <line x1="1420" y1="890" x2="1210" y2="800" stroke="#334155" stroke-width="1.8"/>
  <line x1="1420" y1="910" x2="1210" y2="900" stroke="#334155" stroke-width="1.8"/>
  <line x1="1420" y1="930" x2="1210" y2="1000" stroke="#334155" stroke-width="1.8"/>
  <line x1="1420" y1="950" x2="1200" y2="1100" stroke="#334155" stroke-width="1.8"/>

  <!-- Verification Note -->
  <g transform="translate(60, 1180)">
    <rect width="1480" height="150" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="24" y="32" font-size="15" font-weight="bold" fill="#0f172a">UML 2.5 Use Case Diagram Verification &amp; Semantic Rule Checklist:</text>
    <text x="24" y="60" font-size="13" fill="#334155">• <tspan font-weight="bold">Authentic Actors Only:</tspan> Strictly includes verified institutional roles (<tspan font-weight="bold">Student, Staff, Administrator</tspan>). No fictitious external gateways or ERP actors.</text>
    <text x="24" y="84" font-size="13" fill="#334155">• <tspan font-weight="bold">Formal Notation:</tspan> Actors drawn as stick figures, use cases enclosed in standard horizontal ovals, inside a clearly designated system boundary.</text>
    <text x="24" y="108" font-size="13" fill="#334155">• <tspan font-weight="bold">Dependency Semantics:</tspan> Correct usage of <tspan font-style="italic">&lt;&lt;include&gt;&gt;</tspan> dependency arrow for mandatory category metadata completion during request submission.</text>
    <text x="24" y="132" font-size="13" fill="#334155">• <tspan font-weight="bold">Absence of Self-Registration:</tspan> No public registration use case exists; authentic login via institutional credentials only.</text>
  </g>
</svg>